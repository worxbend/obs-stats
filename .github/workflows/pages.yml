name: Microsite

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/images/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r site/. _site/
          # The screenshots are generated into docs/images so the README can
          # use them too; the site references them at images/.
          mkdir -p _site/images
          cp docs/images/*.svg _site/images/
          # Jekyll would otherwise try to process this and drop underscored files.
          touch _site/.nojekyll
          ls -la _site _site/images

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
