name: Microsite

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/images/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; never cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4

      - name: Assemble
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r site/. _site/
          # The screenshots are generated into docs/images so the README can
          # use them too; the site references them at images/.
          mkdir -p _site/images
          cp docs/images/*.svg _site/images/
          # Jekyll would otherwise try to process this and drop underscored files.
          touch _site/.nojekyll

      - name: Check local assets and anchors
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = set()
                  self.urls = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      assert attrs['id'] not in self.ids, f"Duplicate id: {attrs['id']}"
                      self.ids.add(attrs['id'])
                  for key in ('href', 'src'):
                      if key in attrs:
                          self.urls.append(attrs[key])
                  if tag == 'img':
                      assert attrs.get('alt'), 'Preview images need descriptive alt text'

          root = Path('_site').resolve()
          pages = {}
          for path in sorted(root.rglob('*.html')):
              parser = Links()
              parser.feed(path.read_text())
              pages[path] = parser
          assert pages, 'No HTML pages assembled'
          checked = 0
          for page, parser in pages.items():
              for url in parser.urls:
                  parts = urlsplit(url)
                  if parts.scheme or parts.netloc:
                      continue
                  assert not parts.path.startswith('/'), f'Pages subpath unsafe: {url}'
                  target = (page.parent / unquote(parts.path)).resolve() if parts.path else page
                  assert target.is_relative_to(root), f'Asset escapes site: {url}'
                  if target.is_dir():
                      target /= 'index.html'
                  assert target.is_file(), f'Missing exact asset: {page.name}: {url}'
                  if parts.fragment and target in pages:
                      assert unquote(parts.fragment) in pages[target].ids, f'Broken anchor: {url}'
                  checked += 1
          print(f'Validated {checked} local asset/anchor references in {len(pages)} HTML page(s)')
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
