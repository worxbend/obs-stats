[package]
name = "obs-stats"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A btop-style terminal dashboard for OBS Studio, powered by obs-websocket 5.x"
repository = "https://github.com/worxbend/obs-stats"
homepage = "https://worxbend.github.io/obs-stats/"
readme = "README.md"
keywords = ["obs", "tui", "ratatui", "monitoring", "streaming"]
categories = ["command-line-utilities", "visualization"]
exclude = ["site/", "docs/images/", ".github/"]

[[bin]]
name = "obs-stats"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
thiserror = "2"
anyhow = "1"
directories = "5"
sha2 = "0.10"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Desktop notifications, Linux only. The default backend links C libdbus,
# which would break the static musl build and cross-compilation; the "z"
# feature is a pure-Rust D-Bus client instead. Scoped to Linux so the macOS
# and Windows release targets never pull it at all.
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = { version = "4.17", default-features = false, features = ["z"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
